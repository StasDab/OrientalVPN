# Полный стек: Postgres + Redis + бот (одна команда на VPS).
# Подготовка: скопируйте .env на сервер (из .env.example), выставьте секреты и URL панелей.
# Запуск из корня репозитория:
#   docker compose -f infra/docker-compose.stack.yml --env-file .env up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: myvpn-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myvpn}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-myvpn}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - myvpn

  redis:
    image: redis:7-alpine
    container_name: myvpn-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - myvpn

  bot:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: myvpn-bot
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-myvpn}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - myvpn

volumes:
  pg_data:
  redis_data:

networks:
  myvpn:
    driver: bridge
